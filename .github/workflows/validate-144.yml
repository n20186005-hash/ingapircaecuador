name: Verify static attraction pages
on:
  push:
    branches: [verify/144-static-guides]
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci --no-audit --no-fund
      - run: npm run build
      - name: Check every exported detail and its media
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags=[]
              def handle_starttag(self,tag,attrs):
                  self.tags.append((tag,dict(attrs)))
          out=Path('out')
          for lang in ('es','en','zh'):
              pages=sorted((out/lang/'nearby').rglob('*.html'))
              assert len(pages)==31,(lang,len(pages))
              for p in pages:
                  doc=Page()
                  doc.feed(p.read_text())
                  tags=[tag for tag,_ in doc.tags]
                  assert tags.count('details')>=3 and tags.count('li')>=3 and 'footer' in tags and 'ol' in tags,p
                  imgs=[a.get('src','') for tag,a in doc.tags if tag=='img' and '/nearby/' in a.get('src','')]
                  assert imgs and all((out/src.lstrip('/')).is_file() for src in imgs),p
                  assert any(t=='link' and a.get('rel')=='canonical' and p.stem in a.get('href','') for t,a in doc.tags),p
                  print('PASS',p)
          print('93/93 detail pages exported')
          PY
