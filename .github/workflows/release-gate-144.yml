name: Verify 144 release candidate
on:
  push:
    branches: [verify/144-release-gate]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
      - run: npm ci --no-audit --no-fund
      - name: Audit locked dependencies
        id: audit
        continue-on-error: true
        run: npm audit --json > audit-report.json
      - run: npm run build
      - name: Verify exported pages and assets
        run: |
          python - <<'PY'
          from pathlib import Path
          from html.parser import HTMLParser
          class Page(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags = []
              def handle_starttag(self, tag, attrs):
                  self.tags.append((tag, dict(attrs)))
          out = Path('out')
          assert (out / '_redirects').read_text().strip() == '/ /en 302'
          for lang in ('es', 'en', 'zh'):
              assert (out / (lang + '.html')).is_file(), lang
              pages = sorted((out / lang / 'nearby').rglob('*.html'))
              assert len(pages) == 31, (lang, len(pages))
              for slug in ('coyoctor', 'catedral-nueva', 'pumapungo'):
                  assert (out / lang / 'nearby' / (slug + '.html')).is_file(), (lang, slug)
              for p in pages:
                  doc = Page()
                  doc.feed(p.read_text())
                  tags = [tag for tag, _ in doc.tags]
                  assert tags.count('details') >= 3 and tags.count('li') >= 3 and 'footer' in tags and 'ol' in tags, p
                  imgs = [a.get('src', '') for tag, a in doc.tags if tag == 'img' and '/nearby/' in a.get('src', '')]
                  assert imgs and all((out / src.lstrip('/')).is_file() for src in imgs), p
                  assert any(t == 'link' and a.get('rel') == 'canonical' and p.stem in a.get('href', '') for t, a in doc.tags), p
          print('PASS: 93 detail pages, referenced images, locale homepages and root redirect rule')
          PY
      - name: Save exact export and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-gate-${{ github.sha }}
          path: |
            out/
            audit-report.json
          if-no-files-found: error
          retention-days: 7
      - name: Enforce audit result
        if: always() && steps.audit.outcome != 'success'
        run: exit 1
